<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" role="img" aria-label="Photo coming soon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151925"/>
      <stop offset="1" stop-color="#0B0D14"/>
    </linearGradient>
    <radialGradient id="glow" cx="200" cy="140" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9420" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FF9420" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#glow)"/>

  <!-- Faint grid, matching the site's ambient treatment -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 75h400M0 150h400M0 225h400"/>
    <path d="M80 0v300M160 0v300M240 0v300M320 0v300"/>
  </g>

  <!-- Small, correctly-proportioned car glyph -->
  <g transform="translate(200 138)" stroke="#8B93A5" stroke-opacity="0.55"
     stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-42 12 V-2 l9-17 h48 l13 17 h10 a6 6 0 0 1 6 6 v8"/>
    <path d="M-48 12 H48"/>
    <path d="M-19 -19 v17"/>
    <circle cx="-25" cy="12" r="9"/>
    <circle cx="26" cy="12" r="9"/>
  </g>

  <text x="200" y="196" text-anchor="middle"
        font-family="Sora, Inter, system-ui, sans-serif" font-size="11" font-weight="600"
        letter-spacing="2.6" fill="#6C7488">PHOTO COMING SOON</text>
</svg>
